name: RUA V2 Facebook existing Reel caption repair (no repost)
on:
  push:
    branches: [main]
    paths:
      - "maintenance/fix_rua_v2_facebook_caption.py"
permissions:
  contents: read
concurrency:
  group: rua-v2-facebook-caption-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify existing Reel and update top-of-caption referrals without reposting
        env:
          META_PAGE_ACCESS_TOKEN: "${{ secrets.META_PAGE_ACCESS_TOKEN }}"
          META_SYSTEM_USER_ACCESS_TOKEN: "${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}"
          META_FACEBOOK_PAGE_ID: "${{ vars.META_FACEBOOK_PAGE_ID || '1424295310764332' }}"
          META_INSTAGRAM_ACCOUNT_ID: "${{ vars.META_INSTAGRAM_ACCOUNT_ID || '17841475811391464' }}"
        run: python maintenance/fix_rua_v2_facebook_caption.py
