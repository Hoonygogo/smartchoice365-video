name: One-off reviewed recipe photo candidate generation (free)
on:
  push:
    branches: [main]
    paths: ['requests/smart-meals-photo-oneoff.json']
permissions:
  contents: write
concurrency:
  group: smart-meals-photo-oneoff
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Validate explicit one-recipe request and export safe slug and stage indices
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,re
          d=json.load(open('requests/smart-meals-photo-oneoff.json'))
          slug=d.get('recipeSlug')
          steps=d.get('photoStages')
          assert d.get('version')==1 and isinstance(slug,str) and re.fullmatch('[a-z0-9]+(?:-[a-z0-9]+)*',slug)
          assert isinstance(steps,list) and 2<=len(steps)<=7 and all(isinstance(x,int) for x in steps)
          with open(os.environ['GITHUB_ENV'],'a') as f:
            f.write('RECIPE_SLUG='+slug+'\n')
            f.write('PHOTO_STEPS='+','.join(map(str,steps))+'\n')
          print('Validated one-off recipe photography request',slug,steps)
          PY
      - name: Generate new photo candidates with exact method and separate 1536px hero and finish
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED }}
        run: python3 scripts/smart_meals_process_photo_batch.py
      - name: Save generated originals for expert visual QA (not auto-published)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/smart-meals-process-photos/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Generate additional photo candidates from exact Smart Meals recipe [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
