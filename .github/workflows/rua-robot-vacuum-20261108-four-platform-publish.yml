name: "RUA robot vacuum: approved YouTube and Meta auto release, Naver Clip handoff"
on:
  push:
    branches: [main]
    paths:
      - "uploads/RUA_RobotVacuum_OfficialEnding_20s_1080x1920.mp4"
permissions:
  contents: write
  actions: read
concurrency:
  group: rua-robot-vacuum-20261108-exact-upload
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved MP4 hash, streams, ending duration and playback
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          p = pathlib.Path("uploads/RUA_RobotVacuum_OfficialEnding_20s_1080x1920.mp4")
          approved_hash = "ffb71560d4da3a8031a19b3e58684931024ed99543307ed04f1ae0eef0bb1d51"
          if not p.is_file() or p.stat().st_size != 12542337:
              raise SystemExit("Approved 20s source has not been uploaded or has wrong size.")
          if hashlib.sha256(p.read_bytes()).hexdigest() != approved_hash:
              raise SystemExit("Uploaded MP4 does not match the exact final approved with official V2 ending.")
          info = json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(p)]))
          videos = [s for s in info["streams"] if s["codec_type"] == "video"]
          audios = [s for s in info["streams"] if s["codec_type"] == "audio"]
          if len(videos)!=1 or len(audios)!=1:
              raise SystemExit("Exactly one video and one audio stream required.")
          v, a = videos[0], audios[0]
          if (v.get("codec_name"), a.get("codec_name")) != ("h264","aac") or (v["width"],v["height"])!=(1080,1920):
              raise SystemExit("Only validated 1080x1920 H264/AAC approved MP4 accepted.")
          if not 19.9 <= float(info["format"]["duration"]) <= 20.2:
              raise SystemExit("Approved 10s source plus 10s official outro must be preserved.")
          if float(v["avg_frame_rate"].split("/")[0]) / float(v["avg_frame_rate"].split("/")[1]) != 24:
              raise SystemExit("Wrong frame cadence.")
          print("APPROVED_RUA_ROBOT_VACUUM_V2_OUTRO_READY", approved_hash)
          PY
          ffmpeg -hide_banner -v error -xerror -i uploads/RUA_RobotVacuum_OfficialEnding_20s_1080x1920.mp4 -f null -
      - name: Note the release gate
        run: |
          echo "Exact uploaded media validated; this does not itself prove any social post." >> "$GITHUB_STEP_SUMMARY"

  youtube:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish on YouTube Shorts with public verification and duplicate receipts
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python maintenance/publish_rua_robot_vacuum_20261108.py
      - name: Point to YouTube publication receipt
        if: always()
        run: |
          echo "YouTube receipt: publications/receipts/rua-robot-vacuum-20261108-youtube.json" >> "$GITHUB_STEP_SUMMARY"

  meta:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg for original and delivery verification
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Publish Instagram Reel and Facebook Reel with official API receipts
        env:
          META_PUBLISH_ENABLED: "true"
          META_REQUEST_FILE: "publications/meta-requests/rua-robot-vacuum-20261108.json"
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_SYSTEM_USER_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}
          META_FACEBOOK_PAGE_ID: ${{ vars.META_FACEBOOK_PAGE_ID || '1424295310764332' }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ vars.META_INSTAGRAM_ACCOUNT_ID || '17841475811391464' }}
          GH_TOKEN: ${{ github.token }}
        run: python maintenance/publish_meta_reels.py
      - name: Share verified Instagram Reel to Story without reposting
        env:
          META_PUBLISH_ENABLED: "true"
          META_REQUEST_FILE: "publications/meta-requests/rua-robot-vacuum-20261108.json"
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_SYSTEM_USER_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}
          META_FACEBOOK_PAGE_ID: ${{ vars.META_FACEBOOK_PAGE_ID || '1424295310764332' }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ vars.META_INSTAGRAM_ACCOUNT_ID || '17841475811391464' }}
          GH_TOKEN: ${{ github.token }}
        run: python maintenance/publish_meta_story_from_reel.py
      - name: Point to platform-specific publication receipts
        if: always()
        run: |
          echo "Meta receipts: publications/meta-receipts/rua-robot-vacuum-20261108-{instagram,facebook,instagram-story}.json" >> "$GITHUB_STEP_SUMMARY"
          echo "If a receipt is partial or ambiguous, inspect the platform. Never blindly retry and double post." >> "$GITHUB_STEP_SUMMARY"

  naver_clip_handoff:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package approved MP4 and Korean Clip caption for manual signed-in upload
        run: |
          mkdir -p naver-clip-handoff
          cp uploads/RUA_RobotVacuum_OfficialEnding_20s_1080x1920.mp4 naver-clip-handoff/
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("naver-clip-handoff")
          caption = (
              "루아와 로봇청소기! 🤖🧹 청소는 맡기고 구매는 똑똑하게.\n"
              "로보락 Qrevo L Pro 구매 비교 가이드와 가격·판매자 확인: "
              "https://smartchoice365-web.pages.dev/guides/2026-roborock-qrevo-l-pro-buying-value.html\n"
              "실제 제품 테스트가 아닌 3D 캐릭터 애니메이션입니다.\n"
              "가이드에 제휴 링크가 포함될 수 있으며, 고객에게 별도의 제휴 수수료는 청구되지 않습니다.\n"
              "#루아 #RUA #로봇청소기 #SmartChoice365"
          )
          payload = {
              "id": "rua-robot-vacuum-20261108",
              "status": "manual_handoff_ready_no_auto_upload",
              "naver_profile": "https://clip.naver.com/@smartchoice365",
              "title": "루아와 로봇청소기 🤖🧹",
              "caption": caption,
              "media_file": "RUA_RobotVacuum_OfficialEnding_20s_1080x1920.mp4",
              "source_sha256": "ffb71560d4da3a8031a19b3e58684931024ed99543307ed04f1ae0eef0bb1d51",
              "category_suggestion": "엔터 > 만화·애니",
              "blog_content_link": None,
              "blog_link_status": "not_verified",
              "shopping_connect_product_tag": None,
              "shopping_tag_status": "not_issued_or_verified",
              "ai_use": "review Naver Clip AI-use disclosure toggle in upload UI",
              "advertising": "review affiliate disclosure and ad/collaboration toggle if placing a commercial link",
              "publication": "must use owner's signed-in Naver Clip Creators UI; no verified public upload API",
              "raw_github_video_url": "https://raw.githubusercontent.com/Hoonygogo/smartchoice365-video/"+os.environ["GITHUB_SHA"]+"/uploads/RUA_RobotVacuum_OfficialEnding_20s_1080x1920.mp4"
          }
          (path/"CLIP_CAPTION_KO.txt").write_text(caption+"\n", encoding="utf-8")
          (path/"naver-clip-package.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rua-robot-vacuum-naver-clip-ready
          path: naver-clip-handoff/
          retention-days: 7
      - name: Explain Naver limitation without claiming auto-post success
        run: |
          echo "Naver Clip: downloadable MP4 + title/caption package prepared; manual signed-in Clip Creators upload is required." >> "$GITHUB_STEP_SUMMARY"
          echo "Shopping Connect product tag and blog content link must not be fabricated." >> "$GITHUB_STEP_SUMMARY"
