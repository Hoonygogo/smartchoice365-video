name: "YouTube AI-use disclosure policy tests"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-ai-disclosure-tests.yml"
      - "scripts/youtube_ai_disclosure.py"
      - "scripts/test_youtube_ai_disclosure.py"
      - "maintenance/publish_youtube_generic.py"
      - "scripts/publish_youtube.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile publishing and validation code
        run: python -m py_compile scripts/youtube_ai_disclosure.py scripts/test_youtube_ai_disclosure.py maintenance/publish_youtube_generic.py scripts/publish_youtube.py
      - name: Test required AI disclosure cases
        run: python -m unittest discover -s scripts -p test_youtube_ai_disclosure.py -v
