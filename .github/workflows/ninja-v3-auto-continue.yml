name: Legacy storyboard compatibility - common English guide review
on:
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Reviewed guide JSON for the common English renderer'
        required: true
        type: string
      asset_source_run_id:
        description: 'Run containing reviewed individual scene source artifact'
        required: true
        type: string
      asset_artifact_name:
        description: 'Reviewed scene artifact name'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  preview:
    uses: ./.github/workflows/english-guide-review.yml
    with:
      request_file: ${{ inputs.request_file }}
      asset_source_run_id: ${{ inputs.asset_source_run_id }}
      asset_artifact_name: ${{ inputs.asset_artifact_name }}
