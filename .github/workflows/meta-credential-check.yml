name: Smart Choice 365 — read-only Meta credential check
on:
  push:
    branches: [main]
    paths:
      - maintenance/meta-check-request.txt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meta-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Meta token and identify linked professional assets without posting
        env:
          META_SYSTEM_USER_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}
          META_FACEBOOK_PAGE_ID: ${{ vars.META_FACEBOOK_PAGE_ID }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ vars.META_INSTAGRAM_ACCOUNT_ID }}
        run: python maintenance/verify_meta_connection.py
