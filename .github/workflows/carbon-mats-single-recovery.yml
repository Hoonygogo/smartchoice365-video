name: Carbon mats Korean YouTube — single safe recovery after 502
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/carbon-mats-single-recovery.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: youtube-publication
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exactly approved media without creating duplicates
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python maintenance/recover_carbon_mats_ko.py
