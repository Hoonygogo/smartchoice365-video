name: Regenerate Smart Meals three-bean chopping step naturally
on:
  push:
    branches: [main]
    paths: ['.github/workflows/regenerate-three-bean-step03.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smart-meals-natural-chopping-retry
  cancel-in-progress: false
jobs:
  remake-one-step:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install Pillow image validator
        run: python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: One free-only physically grounded stage-3 candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED }}
        run: python3 scripts/regen_three_bean_step03.py
      - name: Commit unapproved candidate to image workspace only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/smart-meals-process-photos/three-bean-lemon-parsley-salad/step-03-natural-v2.* || true
          if ! git diff --cached --quiet; then
            git commit -m 'Photo candidate: hand-supported parsley chopping, unreviewed [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
