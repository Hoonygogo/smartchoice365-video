name: Verify owner can remove and restore original Smart Meals photographs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-admin-recipe-photo-remove-live.yml'
      - 'scripts/verify_admin_recipe_photo_remove_live.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Check public deployed admin and recipe photo removal
        run: python3 scripts/verify_admin_recipe_photo_remove_live.py
      - name: Commit checked public state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/live-recipe-photo-verification/admin-source-photo-removal.json || true
          if ! git diff --cached --quiet; then
            git commit -m "qa: record live owner authored-photo removal result [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
