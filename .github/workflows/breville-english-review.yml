name: 'Breville English - verified images to Kokoro mobile review'
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'videos/breville-english/**'
      - 'breville-english/render_review.py'
      - '.github/workflows/breville-english-review.yml'
permissions:
  contents: read
jobs:
  mobile-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore committed Breville image pack (one ZIP or individual assets)
        run: |
          test -s assets/smartchoice365-brand-logo-v1.png
          mkdir -p breville-english/assets
          if [ -f videos/breville-english/asset_pack.zip ]; then
            python scripts/import_breville_zip.py videos/breville-english/asset_pack.zip breville-english/assets
          else
            test -s videos/breville-english/approved_visual_manifest.json
            test -d videos/breville-english/images
            cp videos/breville-english/approved_visual_manifest.json breville-english/assets/
            cp videos/breville-english/images/scene_* breville-english/assets/
          fi
      - name: Install established natural English TTS and renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install Pillow numpy soundfile 'kokoro==0.9.4' torch
      - name: Render full quality English mobile review
        run: python breville-english/render_review.py
      - name: Verify output
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 breville-english/out/breville_bambino_plus_english_review.mp4 | grep -qx '1920,1080'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,channels -of csv=p=0 breville-english/out/breville_bambino_plus_english_review.mp4 | grep -q '^aac,2$'
          python -c "import json; from pathlib import Path; m=json.loads(Path('breville-english/out/manifest.json').read_text()); v=json.loads(Path('breville-english/out/voice_receipts.json').read_text()); assert len(m['cues'])==12 and m['photo_led']>=8 and len(v['voice_files'])==12; assert all(c['rms']>=0.008 and c['voice']=='af_heart' and c['speed']==0.96 for c in v['voice_files'])"
      - uses: actions/upload-artifact@v4
        with:
          name: breville-english-photo-kokoro-mobile-review
          path: |
            breville-english/out/breville_bambino_plus_english_review.mp4
            breville-english/out/manifest.json
            breville-english/out/voice_receipts.json
            breville-english/out/voice_*.wav
            config/approved_voices.json
          retention-days: 7
          if-no-files-found: error
