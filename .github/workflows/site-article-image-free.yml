name: Optional English buying guide photo — Workers AI Free
on:
  push:
    branches: [main]
    paths:
      - 'requests/site-article-hero/*.json'
      - 'scripts/prepare_site_article_image.py'
      - '.github/workflows/site-article-image-free.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: optional-site-article-hero-free
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Verify no-cost fallback without network usage
        run: python3 scripts/prepare_site_article_image.py --self-test
      - name: Attempt exactly one optional free image for Brisbane date
        env:
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: \${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_WORKERS_FREE_CONFIRMED: \${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED }}
        run: python3 scripts/prepare_site_article_image.py
      - name: Commit image candidate or fallback report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/site-article-hero/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Record optional no-cost English article image outcome"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new image result to commit."
          fi
