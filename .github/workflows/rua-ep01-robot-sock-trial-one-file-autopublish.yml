name: "RUA EP01 — publish approved robot sock trial on four platforms"
on:
  push:
    branches: [main]
    paths:
      - "uploads/RUA_EP01_FINAL_14s.mp4"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: "rua-ep01-robot-sock-trial-once"
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the exact approved original file before any network publication
        run: |
          python - <<'PY'
          import hashlib, pathlib
          p=pathlib.Path("uploads/RUA_EP01_FINAL_14s.mp4")
          if not p.is_file():
              raise SystemExit("The approved RUA English Introduction file has not been uploaded yet.")
          data=p.read_bytes()
          if len(data)!=3724808 or hashlib.sha256(data).hexdigest()!="672e91ea81e47226d89a8c0cff54707ced43301448308b3ac3314e976587ab3f":
              raise SystemExit("Uploaded file differs from the user-approved original. No publishing.")
          print("APPROVED_RUA_FILE_SHA256_VERIFIED")
          PY
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          python - <<'PY'
          import json,subprocess
          p="uploads/RUA_EP01_FINAL_14s.mp4"
          d=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",p]))
          video=[s for s in d["streams"] if s.get("codec_type")=="video"]
          audio=[s for s in d["streams"] if s.get("codec_type")=="audio"]
          if len(video)!=1 or len(audio)!=1 or video[0].get("codec_name")!="h264" or audio[0].get("codec_name")!="aac":
              raise SystemExit("The owner-approved H264/AAC video and original sound are required.")
          if (video[0].get("width"),video[0].get("height"))!=(720,1280):
              raise SystemExit("Wrong RUA EP01 final 720x1280 format.")
          if not 14.4<=float(d["format"]["duration"])<=14.7:
              raise SystemExit("Wrong 14.55-second final duration; official outro must already be included.")
          print("ORIGINAL_VIDEO_AND_SOUND_VERIFIED")
          PY
      - name: Publish approved original YouTube Short and verify public state
        env:
          GH_TOKEN: "${{ github.token }}"
          YOUTUBE_CLIENT_ID: "${{ secrets.YOUTUBE_CLIENT_ID }}"
          YOUTUBE_CLIENT_SECRET: "${{ secrets.YOUTUBE_CLIENT_SECRET }}"
          YOUTUBE_REFRESH_TOKEN: "${{ secrets.YOUTUBE_REFRESH_TOKEN }}"
        run: python maintenance/publish_rua_ep01_robot_sock_trial.py
      - name: Prepare exact-hash robot vacuum Buying Court Reels request
        run: |
          mkdir -p publications/meta-requests
          python - <<'PY'
          import json
          from pathlib import Path
          channel="https://www.youtube.com/channel/UC4DzAW-Hbd45bIECwGV7-uA"
          home="https://smartchoice365-web.pages.dev/"
          data={
            "id":"rua-ep01-robot-sock-trial-20261102",
            "approval":"publish",
            "full_video_id":"FC4FvuBPS8w",
            "channel_id":"UC4DzAW-Hbd45bIECwGV7-uA",
            "platforms":["instagram","facebook"],
            "media_path":"uploads/RUA_EP01_FINAL_14s.mp4",
            "sha256":"672e91ea81e47226d89a8c0cff54707ced43301448308b3ac3314e976587ab3f",
            "facebook_title":"My Robot Vacuum STOLE My Sock! 😂🤖 | RUA",
            "share_to_instagram_story":True,
            "captions":{
              "instagram":"RUA caught her robot vacuum stealing a sock! 😂🤖 Guilty or innocent?\n\nWatch our full robot vacuum Buying Court 👉 https://www.youtube.com/watch?v=FC4FvuBPS8w\nProduct buying guides: "+home+"\nOfficial YouTube channel: "+channel+"\n\nAnimated scene for entertainment.\n#SmartChoice365 #RUA #RobotVacuum #ShoppingComedy #Reels",
              "facebook":"My robot vacuum STOLE my sock... so RUA put it on trial! 😂🤖\n\nFull robot vacuum Buying Court: https://www.youtube.com/watch?v=FC4FvuBPS8w\nCompare before you buy: "+home+"\nOfficial YouTube: "+channel+"\n\nIllustrative 3D animated scene.\n#SmartChoice365 #RobotVacuum #RUA #Reels"
            },
            "approval_note":"Owner approved exact 14.549s RUA EP01 finished video with original official ending already joined, for YouTube Shorts, Instagram Reel, Facebook Reel and Instagram Story. One-time exact hash gate, free existing official APIs."
          }
          Path("publications/meta-requests/rua-ep01-robot-sock-trial-20261102.json").write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Publish Instagram and Facebook Reels, then the approved Instagram Story
        env:
          META_PUBLISH_ENABLED: "true"
          META_REQUEST_FILE: "publications/meta-requests/rua-ep01-robot-sock-trial-20261102.json"
          META_PAGE_ACCESS_TOKEN: "${{ secrets.META_PAGE_ACCESS_TOKEN }}"
          META_SYSTEM_USER_ACCESS_TOKEN: "${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}"
          META_FACEBOOK_PAGE_ID: "${{ vars.META_FACEBOOK_PAGE_ID || '1424295310764332' }}"
          META_INSTAGRAM_ACCOUNT_ID: "${{ vars.META_INSTAGRAM_ACCOUNT_ID || '17841475811391464' }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          python maintenance/publish_meta_reels.py
          python maintenance/publish_meta_story_from_reel.py
      - name: Recorded publication state
        if: always()
        run: |
          echo "RUA EP01 cross-platform publication attempt completed." >> "$GITHUB_STEP_SUMMARY"
          echo "Verify YouTube receipt under publications/receipts and each Meta platform receipt under publications/meta-receipts." >> "$GITHUB_STEP_SUMMARY"
          echo "Receipts block duplicate uploads; any partial failure requires investigation, not blind retry." >> "$GITHUB_STEP_SUMMARY"
          echo "Instagram Story has no API link sticker, so use the profile website link." >> "$GITHUB_STEP_SUMMARY"
