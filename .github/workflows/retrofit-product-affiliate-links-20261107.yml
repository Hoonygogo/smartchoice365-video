name: "Smart Choice 365 — approved affiliate links in existing product videos"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retrofit-product-affiliate-links-20261107.yml"
      - "maintenance/refresh_affiliate_links_20261107.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sc365-approved-affiliate-description-update-20261107
  cancel-in-progress: false

jobs:
  existing-videos-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and validate updater
        run: python -m py_compile maintenance/refresh_affiliate_links_20261107.py
      - name: Add approved tracked product links, preserve first-line guides, verify results
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_SYSTEM_USER_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_FACEBOOK_PAGE_ID: ${{ vars.META_FACEBOOK_PAGE_ID || '1424295310764332' }}
        run: python maintenance/refresh_affiliate_links_20261107.py
      - name: Record verified successes and blockers
        if: always()
        run: |
          if [ -f publications/affiliate-metadata-results/2026-11-07.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publications/affiliate-metadata-results/2026-11-07.json
            if ! git diff --cached --quiet; then
              git commit -m "Record existing video affiliate metadata results"
              git push origin HEAD:main
            fi
            cat publications/affiliate-metadata-results/2026-11-07.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Updater stopped before writing results. No verified change report." >> "$GITHUB_STEP_SUMMARY"
          fi
