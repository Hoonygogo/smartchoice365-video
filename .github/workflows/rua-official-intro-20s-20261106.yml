name: "RUA Official Intro 20s — approved YouTube + Instagram + Facebook autopublish"
on:
  push:
    branches: [main]
    paths:
      - "uploads/RUA_Shorts_With_Official_Ending(1).mp4"
permissions:
  contents: write
  actions: read
concurrency:
  group: "rua-official-intro-20s-20261106-one-time"
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact approved video, sound, and full decode
        run: |
          python - <<'PY'
          import hashlib, pathlib, json, subprocess
          p=pathlib.Path("uploads/RUA_Shorts_With_Official_Ending(1).mp4")
          if not p.is_file(): raise SystemExit("Approved video not uploaded. Nothing published.")
          if p.stat().st_size != 17752819 or hashlib.file_digest(p.open("rb"),"sha256").hexdigest() != "cb72fc0d99af77bee79f96e2743d45f802b658acaa476b07dd929081cf1d093d":
              raise SystemExit("Unapproved file or hash. No publishing.")
          info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(p)]))
          v=[s for s in info["streams"] if s.get("codec_type")=="video"]
          a=[s for s in info["streams"] if s.get("codec_type")=="audio"]
          if len(v)!=1 or len(a)!=1 or v[0].get("codec_name")!="h264" or a[0].get("codec_name")!="aac":
              raise SystemExit("Expected single H264 video and AAC audio")
          if (v[0].get("width"),v[0].get("height"))!=(1080,1920) or not 19.95<float(info["format"]["duration"])<20.1:
              raise SystemExit("Unexpected duration or portrait dimensions")
          subprocess.run(["ffmpeg","-v","error","-xerror","-i",str(p),"-f","null","-"],check=True)
          print("APPROVED_20S_1080X1920_VIDEO_AND_AUDIO_VERIFIED")
          PY
      - name: Publish approved YouTube Short and verify public state
        env:
          GH_TOKEN: "${{ github.token }}"
          YOUTUBE_CLIENT_ID: "${{ secrets.YOUTUBE_CLIENT_ID }}"
          YOUTUBE_CLIENT_SECRET: "${{ secrets.YOUTUBE_CLIENT_SECRET }}"
          YOUTUBE_REFRESH_TOKEN: "${{ secrets.YOUTUBE_REFRESH_TOKEN }}"
        run: python maintenance/publish_rua_official_intro_20261106.py
      - name: Prepare approved Meta Reels request for same exact file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          home="https://smartchoice365-web.pages.dev/"
          channel="https://www.youtube.com/channel/UC4DzAW-Hbd45bIECwGV7-uA"
          request={
             "id":"rua-official-intro-20s-20261106",
             "approval":"publish",
             "channel_intro":True,
             "channel_id":"UC4DzAW-Hbd45bIECwGV7-uA",
             "platforms":["instagram","facebook"],
             "media_path":"uploads/RUA_Shorts_With_Official_Ending(1).mp4",
             "sha256":"cb72fc0d99af77bee79f96e2743d45f802b658acaa476b07dd929081cf1d093d",
             "facebook_title":"Meet RUA 💜 | Smart Choice 365 Official Intro",
             "share_to_instagram_story":False,
             "story_cta_verified":False,
             "captions":{
               "instagram":"Meet RUA! 💜✨\nSmart Choice 365: "+home+"\nWatch more RUA Shorts: "+channel+"\nFollow for more fun! Link in bio.\n\nFictional character animation.\n#RUA #SmartChoice365 #Reels #Animation #AIAnimation",
               "facebook":"Meet RUA! 💜✨ Our animated Smart Choice 365 friend is here.\nSmart Choice 365: "+home+"\nOfficial YouTube: "+channel+"\nFollow for more fun moments and smart shopping guides!\n\nFictional animated character.\n#RUA #SmartChoice365 #FacebookReels #Animation"
             },
             "approval_note":"Owner approved public release of the 20.01s RUA introduction in chat on 2026-11-06. Use only exact approved SHA and existing free official APIs. No additional ending. Story excluded because video lacks verified website / YouTube CTA."
          }
          path=Path("publications/meta-requests/rua-official-intro-20s-20261106.json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(request,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Publish and verify Instagram + Facebook Reels
        env:
          META_PUBLISH_ENABLED: "true"
          META_REQUEST_FILE: "publications/meta-requests/rua-official-intro-20s-20261106.json"
          META_PAGE_ACCESS_TOKEN: "${{ secrets.META_PAGE_ACCESS_TOKEN }}"
          META_SYSTEM_USER_ACCESS_TOKEN: "${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}"
          META_FACEBOOK_PAGE_ID: "${{ vars.META_FACEBOOK_PAGE_ID || '1424295310764332' }}"
          META_INSTAGRAM_ACCOUNT_ID: "${{ vars.META_INSTAGRAM_ACCOUNT_ID || '17841475811391464' }}"
          GH_TOKEN: "${{ github.token }}"
        run: python maintenance/publish_meta_reels.py
      - name: Publication receipts and no-duplicate guidance
        if: always()
        run: |
          echo "Verify published_verified YouTube receipt in publications/receipts and Meta receipts in publications/meta-receipts." >> "$GITHUB_STEP_SUMMARY"
          echo "No blind retries after ambiguous platform responses; do not publish a duplicate." >> "$GITHUB_STEP_SUMMARY"
          echo "Instagram Story is not in this release pending verified story-specific visible CTA." >> "$GITHUB_STEP_SUMMARY"
