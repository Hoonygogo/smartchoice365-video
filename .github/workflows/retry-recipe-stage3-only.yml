name: Correct three-bean stage 3 preparation photo only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retry-recipe-stage3-only.yml']
permissions:
  contents: write
jobs:
  photo:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - run: python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Strict no-beans prep image prompt
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED }}
        run: python3 scripts/regen_stage3_only.py
      - name: Preserve image candidate for editorial QA
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/smart-meals-process-photos/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Replace erroneous bean-filled prep image with isolated onion and parsley stage [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
