name: Carbon mats Korean full — owner-approved one-file YouTube publish
on:
  push:
    branches: [main]
    paths:
      - 'uploads/SC365_CarbonMat_Korean_Full_Preview.mp4'
permissions:
  contents: write
  actions: read
concurrency:
  group: youtube-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact approved 1080p Korean MP4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('uploads/SC365_CarbonMat_Korean_Full_Preview.mp4')
          assert p.is_file(), 'MP4 not uploaded'
          assert p.stat().st_size==5616343, 'Size differs from approved original'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='d8195e3f02a8ecf39a0f8e9fe059167095b65fa2fc56b6810cc3b7108a6c0946', 'Wrong media hash'
          PY
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 uploads/SC365_CarbonMat_Korean_Full_Preview.mp4 | grep -qx '1920,1080'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 uploads/SC365_CarbonMat_Korean_Full_Preview.mp4 | grep -qx 'audio'
      - name: Publish approved Korean original and verify public video
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python maintenance/publish_carbon_mats_ko.py
