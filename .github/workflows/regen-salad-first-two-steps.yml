name: Remove invented ice and printed cans from salad step photos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/regen-salad-first-two-steps.yml']
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - run: python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Recreate two exact original recipe steps
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED }}
        run: python3 scripts/regen_salad_first_two_steps.py
      - name: Preserve for actual image review
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/smart-meals-process-photos/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Correct staged salad blanching and rinsing photos [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
