name: "RUA Heart Burst 10s — approved four-platform auto-publish"
on:
  push:
    branches: [main]
    paths:
      - "uploads/RUA_Heart_Burst_20261105.mp4"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: "rua-heart-burst-20261105-one-time-multiplatform"
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the exact approved original file before any network publication
        run: |
          python - <<'PY'
          import hashlib, pathlib
          p=pathlib.Path("uploads/RUA_Heart_Burst_20261105.mp4")
          if not p.is_file():
              raise SystemExit("The approved RUA Heart Burst file has not been uploaded yet.")
          data=p.read_bytes()
          if len(data)!=3585977 or hashlib.sha256(data).hexdigest()!="38625d685a36e1eb6d5c6421f10b02aba79ded7c5e99b6c6d5be6102326817b1":
              raise SystemExit("Uploaded file differs from the user-approved original. No publishing.")
          print("APPROVED_RUA_FILE_SHA256_VERIFIED")
          PY
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          python - <<'PY'
          import json,subprocess
          p="uploads/RUA_Heart_Burst_20261105.mp4"
          d=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",p]))
          video=[s for s in d["streams"] if s.get("codec_type")=="video"]
          audio=[s for s in d["streams"] if s.get("codec_type")=="audio"]
          if len(video)!=1 or len(audio)!=1 or video[0].get("codec_name")!="h264" or audio[0].get("codec_name")!="aac":
              raise SystemExit("The owner-approved H264/AAC video and original sound are required.")
          if (video[0].get("width"),video[0].get("height"))!=(720,1280):
              raise SystemExit("Wrong RUA Heart Burst original 720x1280 format.")
          if not 9.9<=float(d["format"]["duration"])<=10.2:
              raise SystemExit("Wrong duration; no outro should be appended.")
          print("ORIGINAL_VIDEO_AND_SOUND_VERIFIED")
          PY
      - name: Publish approved original YouTube Short and verify public state
        env:
          GH_TOKEN: "${{ github.token }}"
          YOUTUBE_CLIENT_ID: "${{ secrets.YOUTUBE_CLIENT_ID }}"
          YOUTUBE_CLIENT_SECRET: "${{ secrets.YOUTUBE_CLIENT_SECRET }}"
          YOUTUBE_REFRESH_TOKEN: "${{ secrets.YOUTUBE_REFRESH_TOKEN }}"
        run: python maintenance/publish_rua_heart_burst_20261105.py
      - name: Prepare exact-hash channel introduction Reels request
        run: |
          mkdir -p publications/meta-requests
          python - <<'PY'
          import json
          from pathlib import Path
          channel="https://www.youtube.com/channel/UC4DzAW-Hbd45bIECwGV7-uA"
          home="https://smartchoice365-web.pages.dev/"
          data={
            "id":"rua-heart-burst-20261105",
            "approval":"publish",
            "channel_intro":True,
            "channel_id":"UC4DzAW-Hbd45bIECwGV7-uA",
            "platforms":["instagram","facebook"],
            "media_path":"uploads/RUA_Heart_Burst_20261105.mp4",
            "sha256":"38625d685a36e1eb6d5c6421f10b02aba79ded7c5e99b6c6d5be6102326817b1",
            "facebook_title":"RUA's Heart Got TOO BIG! 💗😂 | Smart Choice 365",
            "share_to_instagram_story":True,
            "captions":{
              "instagram":"RUA tried to send a tiny heart... and it got HUGE! 💗😂✨\n\nMeet the adorable 3D cartoon RUA and discover Smart Choice 365: "+home+"\nMore RUA Shorts: "+channel+"\n\nThis is an illustrated character animation.\n#SmartChoice365 #RUA #CuteAnimation #HeartBurst #Reels",
              "facebook":"RUA's tiny heart turns into one giant surprise! 💗✨ Meet our cute cartoon star.\n\nDiscover Smart Choice 365: "+home+"\nOfficial YouTube channel: "+channel+"\n\nIllustrative animated character introduction.\n#SmartChoice365 #RUA #CuteAnimation #HeartBurst #Reels"
            },
            "approval_note":"Owner approved publication of the uploaded 10.026667s RUA pink-heart animated video on 2026-11-05. Publish the exact file to YouTube Shorts, Instagram Reels, Facebook Reels, and Instagram Story with existing free official APIs. Do not append outro or modify audio; do not mislabel it as the dancing video."
          }
          Path("publications/meta-requests/rua-heart-burst-20261105.json").write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Publish Instagram and Facebook Reels, then the approved Instagram Story
        env:
          META_PUBLISH_ENABLED: "true"
          META_REQUEST_FILE: "publications/meta-requests/rua-heart-burst-20261105.json"
          META_PAGE_ACCESS_TOKEN: "${{ secrets.META_PAGE_ACCESS_TOKEN }}"
          META_SYSTEM_USER_ACCESS_TOKEN: "${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}"
          META_FACEBOOK_PAGE_ID: "${{ vars.META_FACEBOOK_PAGE_ID || '1424295310764332' }}"
          META_INSTAGRAM_ACCOUNT_ID: "${{ vars.META_INSTAGRAM_ACCOUNT_ID || '17841475811391464' }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          python maintenance/publish_meta_reels.py
          python maintenance/publish_meta_story_from_reel.py
      - name: Recorded publication state
        if: always()
        run: |
          echo "RUA Heart Burst cross-platform publication attempt completed." >> "$GITHUB_STEP_SUMMARY"
          echo "Verify YouTube receipt under publications/receipts and each Meta platform receipt under publications/meta-receipts." >> "$GITHUB_STEP_SUMMARY"
          echo "Receipts block duplicate uploads; any partial failure requires investigation, not blind retry." >> "$GITHUB_STEP_SUMMARY"
          echo "Instagram Story has no API link sticker, so use the profile website link." >> "$GITHUB_STEP_SUMMARY"
