name: Maintain public verified homepage video categories
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "publications/receipts/**"
      - "publications/requests/**"
      - "requests/**"
      - "maintenance/build_homepage_video_index.py"
      - "maintenance/test_homepage_video_index.py"
      - ".github/workflows/homepage-video-index.yml"
  schedule:
    # Upload receipts written by another Actions GITHUB_TOKEN may not trigger push workflows.
    # The free public-repo scheduled refresh repairs that gap without a paid API.
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
concurrency:
  group: verified-homepage-video-format-index
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check verified-only category rules
        run: python -m unittest maintenance/test_homepage_video_index.py -v
      - name: Rebuild public category index
        run: python maintenance/build_homepage_video_index.py
      - name: Commit only if verified video categories changed
        run: |
          git add -- publications/homepage-video-index.json
          if git diff --cached --quiet; then
            echo "No video format changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync verified public homepage video categories [skip ci]"
            git push origin HEAD:main
          fi
