name: "RUA Qrevo L Pro 3-part: upload once / YouTube & Meta auto release / Naver handoff"
on:
  push:
    branches: [main]
    paths:
      - "uploads/RUA_Qrevo_L_Pro_3Parts_OfficialOutro_Affiliate_Ready_1080x1920.mp4"
permissions:
  contents: write
  actions: read
concurrency:
  group: rua-qrevo-l-pro-3part-20261108-exact-upload
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved MP4 hash, streams, ending duration and playback
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          p = pathlib.Path("uploads/RUA_Qrevo_L_Pro_3Parts_OfficialOutro_Affiliate_Ready_1080x1920.mp4")
          approved_hash = "6e4995d7237f417b0cf835d82236f84decb5dd04471276a36ce26efff176e645"
          if not p.is_file() or p.stat().st_size != 16028684:
              raise SystemExit("Approved 3-part source has not been uploaded or has wrong size.")
          if hashlib.sha256(p.read_bytes()).hexdigest() != approved_hash:
              raise SystemExit("Uploaded MP4 does not match the exact final approved with official V2 ending.")
          info = json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(p)]))
          videos = [s for s in info["streams"] if s["codec_type"] == "video"]
          audios = [s for s in info["streams"] if s["codec_type"] == "audio"]
          if len(videos)!=1 or len(audios)!=1:
              raise SystemExit("Exactly one video and one audio stream required.")
          v, a = videos[0], audios[0]
          if (v.get("codec_name"), a.get("codec_name")) != ("h264","aac") or (v["width"],v["height"])!=(1080,1920):
              raise SystemExit("Only validated 1080x1920 H264/AAC approved MP4 accepted.")
          if not 37.7 <= float(info["format"]["duration"]) <= 38.1:
              raise SystemExit("Approved 3-part episode with shipping intertitle, product card and official V2 outro must be preserved.")
          if abs(float(v["avg_frame_rate"].split("/")[0]) / float(v["avg_frame_rate"].split("/")[1]) - 24) > 0.10:
              raise SystemExit("Wrong frame cadence.")
          print("APPROVED_RUA_ROBOT_VACUUM_V2_OUTRO_READY", approved_hash)
          PY
          ffmpeg -hide_banner -v error -xerror -i uploads/RUA_Qrevo_L_Pro_3Parts_OfficialOutro_Affiliate_Ready_1080x1920.mp4 -f null -
      - name: Block posting if either issued affiliate link or disclosure is missing
        run: |
          python - <<'PY'
          import ast, json, pathlib, re
          naver = "https://naver.me/F05el04Z"
          linkprice = "https://bestmore.net/click.php?m=gmarket&a=A100708938&l=9999&l_cd1=3&l_cd2=0&tu=https%3A%2F%2Fitem.gmarket.co.kr%2FItem%3FgoodsCode%3D4822243340"
          script = pathlib.Path("maintenance/publish_rua_qrevo_l_pro_3part_20261108.py").read_text(encoding="utf-8")
          m = re.search(r'^META = json\.loads\((.+)\)$', script, flags=re.M)
          if not m:
              raise SystemExit("Cannot inspect YouTube approved metadata.")
          metadata = json.loads(ast.literal_eval(m.group(1)))
          request = json.loads(pathlib.Path("publications/meta-requests/rua-qrevo-l-pro-3part-20261108.json").read_text(encoding="utf-8"))
          source = pathlib.Path(".github/workflows/rua-qrevo-l-pro-3part-20261108-auto-publish.yml").read_text(encoding="utf-8")
          candidates = {
              "YouTube Shorts": metadata["snippet"]["description"],
              "Instagram Reels": request["captions"]["instagram"],
              "Facebook Reels": request["captions"]["facebook"],
              "Naver Clip handoff": source,
          }
          for platform, caption in candidates.items():
              if naver not in caption or linkprice not in caption:
                  raise SystemExit(f"{platform}: BOTH issued affiliate links are mandatory.")
              if platform != "Naver Clip handoff" and not any(k in caption for k in ("광고", "제휴", "수수료")):
                  raise SystemExit(f"{platform}: affiliate commission disclosure missing.")
          if not request.get("affiliate_programs",{}).get("naver_shopping_connect") or not request.get("affiliate_programs",{}).get("linkprice"):
              raise SystemExit("Approved affiliate program identifiers not attached to Meta request.")
          print("PASS_BOTH_VERIFIED_AFFILIATE_LINKS_IN_ALL_COPY")
          PY
      - name: Note the release gate
        run: |
          echo "Exact new uploaded 3-part media validated; this does not itself prove any social post." >> "$GITHUB_STEP_SUMMARY"

  youtube:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish on YouTube Shorts with public verification and duplicate receipts
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python maintenance/publish_rua_qrevo_l_pro_3part_20261108.py
      - name: Point to YouTube publication receipt
        if: always()
        run: |
          echo "YouTube receipt: publications/receipts/rua-qrevo-l-pro-3part-20261108-youtube.json" >> "$GITHUB_STEP_SUMMARY"

  meta:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg for original and delivery verification
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Publish Instagram Reel and Facebook Reel with official API receipts
        env:
          META_PUBLISH_ENABLED: "true"
          META_REQUEST_FILE: "publications/meta-requests/rua-qrevo-l-pro-3part-20261108.json"
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_SYSTEM_USER_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}
          META_FACEBOOK_PAGE_ID: ${{ vars.META_FACEBOOK_PAGE_ID || '1424295310764332' }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ vars.META_INSTAGRAM_ACCOUNT_ID || '17841475811391464' }}
          GH_TOKEN: ${{ github.token }}
        run: python maintenance/publish_meta_reels.py
      - name: Share verified Instagram Reel to Story without reposting
        env:
          META_PUBLISH_ENABLED: "true"
          META_REQUEST_FILE: "publications/meta-requests/rua-qrevo-l-pro-3part-20261108.json"
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_SYSTEM_USER_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}
          META_FACEBOOK_PAGE_ID: ${{ vars.META_FACEBOOK_PAGE_ID || '1424295310764332' }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ vars.META_INSTAGRAM_ACCOUNT_ID || '17841475811391464' }}
          GH_TOKEN: ${{ github.token }}
        run: python maintenance/publish_meta_story_from_reel.py
      - name: Point to platform-specific publication receipts
        if: always()
        run: |
          echo "Meta receipts: publications/meta-receipts/rua-qrevo-l-pro-3part-20261108-{instagram,facebook,instagram-story}.json" >> "$GITHUB_STEP_SUMMARY"
          echo "If a receipt is partial or ambiguous, inspect the platform. Never blindly retry and double post." >> "$GITHUB_STEP_SUMMARY"

  naver_clip_handoff:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package approved MP4 and Korean Clip caption for manual signed-in upload
        run: |
          mkdir -p naver-clip-handoff
          cp uploads/RUA_Qrevo_L_Pro_3Parts_OfficialOutro_Affiliate_Ready_1080x1920.mp4 naver-clip-handoff/
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("naver-clip-handoff")
          caption = "\n".join(["광고·제휴 안내: 이 클립에는 네이버 쇼핑커넥트 및 링크프라이스 제휴 링크가 포함되어 있으며, 구매 발생 시 수수료를 제공받을 수 있습니다.","루아와 로봇청소기 🤖🧹 청소는 로봇에게, 구매 비교는 스마트초이스365에서!","스마트초이스365는 아무 링크나 추천하지 않습니다. 동일 모델·배송비·판매자·후기·A/S를 조사했습니다. 네이버는 일반 구매조건 우선 비교처이며, G마켓은 대상 카드·스마일페이 결제조건에 맞는 분의 대안입니다.","로보락 Qrevo L Pro 구매 비교 가이드: https://smartchoice365-web.pages.dev/guides/2026-roborock-qrevo-l-pro-buying-value.html","네이버 쇼핑커넥트 추천 판매처: https://naver.me/F05el04Z","G마켓 링크프라이스 구매처 (카드/쿠폰 조건 확인): https://bestmore.net/click.php?m=gmarket&a=A100708938&l=9999&l_cd1=3&l_cd2=0&tu=https%3A%2F%2Fitem.gmarket.co.kr%2FItem%3FgoodsCode%3D4822243340","관련 네이버 블로그 비교글: https://blog.naver.com/smartchoice365/224469034521","실제 제품 시연이 아닌 창작 3D 캐릭터 애니메이션입니다. 가격·회원 혜택·배송비는 결제 시점과 개인별 조건에 따라 달라집니다.","제휴 링크를 이용해도 고객에게 별도의 제휴 수수료는 청구되지 않습니다.","#루아 #RUA #로봇청소기 #SmartChoice365"])
          payload = {
              "id": "rua-qrevo-l-pro-3part-20261108",
              "status": "manual_handoff_ready_no_auto_upload",
              "naver_profile": "https://clip.naver.com/@smartchoice365",
              "title": "루아와 로봇청소기 🤖🧹",
              "caption": caption,
              "media_file": "RUA_Qrevo_L_Pro_3Parts_OfficialOutro_Affiliate_Ready_1080x1920.mp4",
              "source_sha256": "6e4995d7237f417b0cf835d82236f84decb5dd04471276a36ce26efff176e645",
              "category_suggestion": "엔터 > 만화·애니",
              "blog_content_link": "https://blog.naver.com/smartchoice365/224469034521",
              "blog_link_status": "owner_blog_url_verified; attach exact article in Clip UI before publication",
              "shopping_connect_product_tag": {"product": "로보락 Qrevo L Pro", "seller": "로보락판매점", "issued_affiliate_url": "https://naver.me/F05el04Z", "native_tag_required": True, "status": "requires_manual_search_attach_and_readback_in_Naver_UI"},
              "linkprice_gmarket": "https://bestmore.net/click.php?m=gmarket&a=A100708938&l=9999&l_cd1=3&l_cd2=0&tu=https%3A%2F%2Fitem.gmarket.co.kr%2FItem%3FgoodsCode%3D4822243340",
              "affiliate_disclosure_required": True,
              "advertising_collaboration_switch": "on",
              "shopping_tag_status": "issued_naver_link_confirmed_in_guide; native_clip_tag_not_attached_yet",
              "ai_use": True,
              "advertising": True,
              "publication": "must use owner's signed-in Naver Clip Creators UI; no verified public upload API",
              "raw_github_video_url": "https://raw.githubusercontent.com/Hoonygogo/smartchoice365-video/"+os.environ["GITHUB_SHA"]+"/uploads/RUA_Qrevo_L_Pro_3Parts_OfficialOutro_Affiliate_Ready_1080x1920.mp4"
          }
          (path/"CLIP_CAPTION_KO.txt").write_text(caption+"\n", encoding="utf-8")
          (path/"naver-clip-package.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rua-qrevo-l-pro-3part-naver-clip-ready
          path: naver-clip-handoff/
          retention-days: 7
      - name: Explain Naver limitation without claiming auto-post success
        run: |
          echo "Naver Clip: downloadable MP4 + title/caption package prepared; manual signed-in Clip Creators upload is required." >> "$GITHUB_STEP_SUMMARY"
          echo "Shopping Connect product tag and blog content link must not be fabricated." >> "$GITHUB_STEP_SUMMARY"
