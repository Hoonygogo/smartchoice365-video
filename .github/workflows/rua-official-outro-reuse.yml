name: RUA official V2 10s outro - verify and reuse for KR EN Shorts (no publication)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rua-official-outro-reuse.yml"
      - "uploads/rua-comedy/**"
      - "assets/rua/official-outro.mp4"
      - "assets/rua/official-outro.json"
  workflow_dispatch:
    inputs:
      clip_path:
        description: "Optional new, approved 10-second video under uploads/rua-comedy/"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: "rua-official-outro-and-render"
  cancel-in-progress: false
jobs:
  archive_and_join:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Verify SHA256 of approved 10-second RUA V2 signature outro
        run: python maintenance/rua_official_outro.py build
      - name: Identify a new comedy clip if uploaded
        id: detect
        shell: bash
        env:
          REQUESTED_CLIP: "${{ inputs.clip_path }}"
        run: |
          clip=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            clip="$REQUESTED_CLIP"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            mapfile -t added < <(git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD | grep -E '^uploads/rua-comedy/[^/]+\.mp4$' || true)
            if [[ "${#added[@]}" -gt 1 ]]; then
              echo "Upload one RUA comedy clip at a time to prevent ambiguous releases." >&2
              exit 1
            fi
            if [[ "${#added[@]}" -eq 1 ]]; then clip="${added[0]}"; fi
          fi
          if [[ -n "$clip" ]]; then
            if [[ ! "$clip" =~ ^uploads/rua-comedy/[^/]+\.mp4$ || ! -f "$clip" ]]; then
              echo "Only an existing uploads/rua-comedy/*.mp4 may be joined." >&2
              exit 1
            fi
            echo "Found approved comedy upload: $clip"
          fi
          echo "clip=$clip" >> "$GITHUB_OUTPUT"
      - name: Automatically append official outro to newly uploaded comedy clip
        if: steps.detect.outputs.clip != ''
        env:
          RUA_CLIP: "${{ steps.detect.outputs.clip }}"
        run: python maintenance/rua_official_outro.py append "$RUA_CLIP"
      - name: Commit any new approved preview render only
        shell: bash
        env:
          RUA_CLIP: "${{ steps.detect.outputs.clip }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$RUA_CLIP" ]]; then
            git add renders/rua/
          fi
          if git diff --cached --quiet; then
            echo "No changes. Official outro already archived; no duplicate preview."
          else
            git commit -m "Render approved RUA clip using SHA256-verified 10s V2 outro"
            git push origin HEAD:main
          fi
      - name: Summarize asset and preview status
        if: always()
        run: |
          echo "Official RUA outro: assets/rua/official-outro.mp4" >> "$GITHUB_STEP_SUMMARY"
          echo "The approved full 10s V2 is backed up in ChatGPT Library /SmartChoice365/RUA/RUA_Official_Signature_Outro_V2_10s.mp4" >> "$GITHUB_STEP_SUMMARY"
          echo "KR/EN 10s new clips under uploads/rua-comedy/ are rendered to renders/rua/ with this ending." >> "$GITHUB_STEP_SUMMARY"
          echo "Approved V2 SHA256: ae161a9dc3d34f705d67ca081cbb708d03e1a2778a4753e2a2ee413ce768b495; this job fails closed until that exact MP4 exists in assets/rua/official-outro.mp4." >> "$GITHUB_STEP_SUMMARY"
          echo "No social publication happens in this workflow. Owner review/approval is needed before posting." >> "$GITHUB_STEP_SUMMARY"
