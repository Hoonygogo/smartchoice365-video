name: Recreate rejected three-bean recipe photos free only
on:
  push:
    branches: [main]
    paths: [".github/workflows/recreate-rejected-three-bean-images.yml"]
permissions:
  contents: write
jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - run: python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Generate only missing and rejected food image candidates
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED }}
        run: python3 scripts/regenerate_three_bean_rejected_candidates.py
      - name: Save previews only for QA
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/smart-meals-process-photos/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Recreate rejected three-bean process imagery accurately [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
