name: Build Sarah Korean Draft

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requests/**'
      - 'scripts/**'
      - 'assets/**'
      - 'requirements.txt'
      - '.github/workflows/draft.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: video-draft
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install video and Korean font dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install -r requirements.txt
      - name: Check full-photo layout and disclosure separation
        run: python scripts/check_photo_layout.py
      - name: Download pinned public speech model
        run: python scripts/download_model.py
      - name: Render narration-synchronized highlights
        run: python scripts/render_synced.py
      - name: Permanently archive approved Korean Sarah voice reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          target='voices/reference/korean_sarah_f1_110.wav'
          repo=os.environ['GITHUB_REPOSITORY']
          existing=subprocess.run(['gh','api',f'repos/{repo}/contents/{target}'],capture_output=True)
          if existing.returncode==0:
              print('Permanent Korean voice reference already exists; preserving it.')
          else:
              manifest=json.loads(Path('output/manifest.json').read_text())
              candidates=list(Path('output').glob('*.mp4'))
              if not candidates: raise RuntimeError('Korean preview MP4 missing; cannot save voice reference')
              sample=Path('output/korean_sarah_reference.wav')
              subprocess.run(['ffmpeg','-nostdin','-v','error','-y','-i',str(candidates[0]),
                              '-vn','-t','6','-ac','1','-ar','24000',str(sample)],check=True)
              import soundfile as sf,numpy as np,base64
              audio,sr=sf.read(sample)
              if len(audio)<sr or float(np.sqrt(np.mean(audio**2)))<0.008:
                  raise RuntimeError('Sarah reference has no verified audible audio')
              payload={'message':'Preserve Korean Sarah F1 approved voice reference [skip ci]',
                       'content':base64.b64encode(sample.read_bytes()).decode()}
              subprocess.run(['gh','api','--method','PUT',f'repos/{repo}/contents/{target}',
                              '--input','-'],input=json.dumps(payload).encode(),check=True)
              print('Permanent Korean Sarah reference saved:',target)
          PY
      - name: Keep a short-lived downloadable draft
        uses: actions/upload-artifact@v4
        with:
          name: sarah-korean-draft-${{ github.run_number }}
          path: output/
          retention-days: 3
          if-no-files-found: error
      - name: Prepare mobile preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/
          retention-days: 1
      - name: Draft summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('output/manifest.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Sarah 한국어 초안\n\nSNS 미발행 · 사용자 컨펌 대기\n\n')
              f.write(f"버전: `{m['sha256'][:12]}`\n\n")
              f.write('미리보기: https://hoonygogo.github.io/smartchoice365-video/\n\n')
              f.write('처음 한 번 Settings → Pages → Source: GitHub Actions 설정이 필요합니다.\n')
          PY
  preview:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approval preview only
        id: deployment
        uses: actions/deploy-pages@v4

