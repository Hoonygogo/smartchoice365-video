name: Correct and optimise one-off tomato penne photo candidates
on:
  push:
    branches: [main]
    paths: ['.github/workflows/penne-photo-quality-rework.yml']
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - run: python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Regenerate only two inaccurate intermediate cooking photos
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED }}
        run: python3 scripts/regen_penne_bad_steps.py
      - name: Optimise all seven candidates without upscaling
        run: python3 scripts/optimize_penne_photo_candidates.py
      - name: Store QA candidates with unmodified original master assets
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/smart-meals-process-photos/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Correct penne ingredient images and optimise exact cooking photos [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
