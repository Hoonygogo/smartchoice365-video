name: RUA dance with official ending — four-platform publish
on:
  push:
    branches: [main]
    paths:
      - "uploads/RUA_Shorts_With_Official_Ending.mp4"
permissions:
  contents: write
  actions: read
concurrency:
  group: "rua-signature-dance-20261106"
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the exact approved original file before any network publication
        run: |
          python - <<'PY'
          import hashlib, pathlib
          p=pathlib.Path("uploads/RUA_Shorts_With_Official_Ending.mp4")
          if not p.is_file():
              raise SystemExit("The approved 20-second RUA V2 file has not been uploaded yet.")
          data=p.read_bytes()
          if len(data)!=17752819 or hashlib.sha256(data).hexdigest()!="cb72fc0d99af77bee79f96e2743d45f802b658acaa476b07dd929081cf1d093d":
              raise SystemExit("Uploaded file differs from the user-approved original. No publishing.")
          print("APPROVED_RUA_FILE_SHA256_VERIFIED")
          PY
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          python - <<'PY'
          import json,subprocess
          p="uploads/RUA_Shorts_With_Official_Ending.mp4"
          d=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",p]))
          video=[s for s in d["streams"] if s.get("codec_type")=="video"]
          audio=[s for s in d["streams"] if s.get("codec_type")=="audio"]
          if len(video)!=1 or len(audio)!=1 or video[0].get("codec_name")!="h264" or audio[0].get("codec_name")!="aac":
              raise SystemExit("The owner-approved H264/AAC video and original sound are required.")
          if (video[0].get("width"),video[0].get("height"))!=(1080,1920):
              raise SystemExit("Wrong RUA final 1080x1920 format.")
          if not 19.95<=float(d["format"]["duration"])<=20.05:
              raise SystemExit("Wrong 20-second final duration; approved V2 outro must already be included.")
          print("ORIGINAL_VIDEO_AND_SOUND_VERIFIED")
          PY
      - name: Publish approved 20-second V2 YouTube Short and verify public state
        env:
          GH_TOKEN: "${{ github.token }}"
          YOUTUBE_CLIENT_ID: "${{ secrets.YOUTUBE_CLIENT_ID }}"
          YOUTUBE_CLIENT_SECRET: "${{ secrets.YOUTUBE_CLIENT_SECRET }}"
          YOUTUBE_REFRESH_TOKEN: "${{ secrets.YOUTUBE_REFRESH_TOKEN }}"
        run: python maintenance/publish_rua_signature_dance.py
      - name: Prepare exact-hash RUA dance Reels request
        run: |
          mkdir -p publications/meta-requests
          python - <<'PY'
          import json
          from pathlib import Path
          channel="https://www.youtube.com/channel/UC4DzAW-Hbd45bIECwGV7-uA"
          home="https://smartchoice365-web.pages.dev/"
          data={
            "id":"rua-signature-dance-20261106",
            "approval":"publish",
            "channel_intro":True,
            "channel_id":"UC4DzAW-Hbd45bIECwGV7-uA",
            "platforms":["instagram","facebook"],
            "media_path":"uploads/RUA_Shorts_With_Official_Ending.mp4",
            "sha256":"cb72fc0d99af77bee79f96e2743d45f802b658acaa476b07dd929081cf1d093d",
            "facebook_title":"RUA’s Heart Surprise & Happy Dance 💗 | Smart Choice 365",
            "share_to_instagram_story":True,
            "story_cta_verified":True,
            "captions":{
              "instagram":"A giant heart, a happy dance and RUA’s official ending. 💗\nSmart Choice 365 (link in bio): "+home+"\nOfficial YouTube: "+channel+"\n#SmartChoice365 #RUA #Animation #Reels",
              "facebook":"A giant heart, a happy dance and RUA’s official ending. 💗\nSmart Choice 365: "+home+"\nOfficial YouTube: "+channel+"\n#SmartChoice365 #RUA #Animation #Reels"
            },
            "approval_note":"Owner approved this exact 20-second file for YouTube Shorts, Facebook Reels, Instagram Reels and Instagram Story. The official ending shows Subscribe and Follow CTAs."
          }
          Path("publications/meta-requests/rua-signature-dance-20261106.json").write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Publish Instagram and Facebook Reels, then the approved Instagram Story
        env:
          META_PUBLISH_ENABLED: "true"
          META_REQUEST_FILE: "publications/meta-requests/rua-signature-dance-20261106.json"
          META_PAGE_ACCESS_TOKEN: "${{ secrets.META_PAGE_ACCESS_TOKEN }}"
          META_SYSTEM_USER_ACCESS_TOKEN: "${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}"
          META_FACEBOOK_PAGE_ID: "${{ vars.META_FACEBOOK_PAGE_ID || '1424295310764332' }}"
          META_INSTAGRAM_ACCOUNT_ID: "${{ vars.META_INSTAGRAM_ACCOUNT_ID || '17841475811391464' }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          python maintenance/publish_meta_reels.py
          python maintenance/publish_meta_story_from_reel.py
      - name: Recorded publication state
        if: always()
        run: |
          echo "RUA dance 20-second cross-platform publication attempt completed." >> "$GITHUB_STEP_SUMMARY"
          echo "Verify YouTube receipt under publications/receipts and each Meta platform receipt under publications/meta-receipts." >> "$GITHUB_STEP_SUMMARY"
          echo "Receipts block duplicate uploads; any partial failure requires investigation, not blind retry." >> "$GITHUB_STEP_SUMMARY"
          echo "Instagram Story has no API link sticker, so use the profile website link." >> "$GITHUB_STEP_SUMMARY"
