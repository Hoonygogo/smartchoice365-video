name: Verify live matcha latte original 5-step pictures (2026-11-23)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-matcha-latte-20261123.yml'
      - 'scripts/verify_matcha_latte_live_20261123.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verify-matcha-latte-20261123
  cancel-in-progress: false
jobs:
  public-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Verify both live recipe pages and exact six JPEG hashes and dimensions
        run: |
          python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
          python3 scripts/verify_matcha_latte_live_20261123.py
      - name: Record actual Cloudflare verification, including failure details
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/live-recipe-photo-verification/matcha-latte-20261123.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Audit public matcha latte photos for both languages [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
