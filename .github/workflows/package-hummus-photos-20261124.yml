name: Package reviewed lemon garlic hummus photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-hummus-photos-20261124.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hummus-7-photo-final-package-20261124
  cancel-in-progress: false
jobs:
  package-seven-photos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Validate seven original JPEG photos and create preview ZIP
        run: |
          python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
          python3 -m py_compile scripts/package_hummus_process_photos_20261124.py
          python3 scripts/package_hummus_process_photos_20261124.py
      - name: Commit checked ZIP, contact preview and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/recipe-step-photo/silky-lemon-garlic-hummus/hummus-hero-and-6-process-photos.zip
          git add artifacts/recipe-step-photo/silky-lemon-garlic-hummus/preview-contact-sheet.jpg
          git add artifacts/recipe-step-photo/silky-lemon-garlic-hummus/package-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Package reviewed silky lemon garlic hummus photo originals [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
