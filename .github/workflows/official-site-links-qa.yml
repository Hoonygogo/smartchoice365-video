name: Official Smart Choice 365 URLs in future social publishing
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # 19:00 Brisbane daily
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-site-links-qa.yml'
      - 'maintenance/official_site_urls.py'
      - 'tests/test_official_site_urls.py'
      - 'maintenance/publish_meta_reels.py'
      - 'maintenance/publish_youtube_generic.py'
      - 'maintenance/publish_youtube_v8.py'
      - 'maintenance/publish_shorts_from_render.py'
      - 'maintenance/prepare_naver_clip.py'
      - 'scripts/publish_youtube.py'
      - 'scripts/render.py'
      - 'scripts/draw_intro.py'
      - 'scripts/publish_*.py'
      - 'maintenance/publish_*.py'
      - 'publications/staged-meta-requests/**'
      - 'publications/auto-shorts-requests/**'
      - 'publications/meta-requests/**'
      - 'publications/requests/**'
permissions:
  contents: read
jobs:
  check_new_outbound_links:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate syntax for new-link publishers
        run: |
          python3 -m py_compile maintenance/official_site_urls.py maintenance/publish_meta_reels.py maintenance/publish_youtube_generic.py maintenance/publish_youtube_v8.py maintenance/publish_shorts_from_render.py maintenance/prepare_naver_clip.py scripts/publish_youtube.py scripts/render.py scripts/draw_intro.py
      - name: Verify official URL validation and Naver Clip draft safety
        run: |
          python3 -m unittest discover -s tests -p 'test_official_site_urls.py' -v
          python3 -m unittest discover -s tests -p 'test_naver_clip_handoff.py' -v
      - name: Inventory any remaining legacy website references in current source and future templates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roots = ('.github/workflows','maintenance','scripts','config','requests',
                   'production','ninja-english','guides')
          extensions = {'.py','.json','.js','.mjs','.md','.yml','.yaml','.txt'}
          found=[]
          for root in roots:
              base=Path(root)
              if not base.exists():continue
              for f in base.rglob('*'):
                  if not f.is_file() or f.suffix.lower() not in extensions:continue
                  if f.stat().st_size>1_000_000:continue
                  txt=f.read_text(encoding='utf-8',errors='replace')
                  count=txt.count('smartchoice365-web.pages.dev')
                  if count:found.append((f.as_posix(),count))
          print('LEGACY SOURCE INVENTORY (includes historical code + explicit rejection guards):')
          for path,count in found:
              print(path,count)
          print('Legacy-bearing source files:',len(found),
                ' / legacy literal occurrences:',sum(n for _,n in found))
          # Historical approvals/receipts are immutable, but future publisher
          # source and launch workflows must not reintroduce the old URL.
          allow={'official-site-links-qa.yml','one-time-official-domain-migration.yml'}
          active=[p for p,n in found if
                  (p.startswith('.github/workflows/') and Path(p).name not in allow)
                  or p.startswith('maintenance/publish_')
                  or (p.startswith('scripts/') and
                      (Path(p).name.startswith('publish_') or
                       Path(p).name in {'render.py','draw_intro.py'}))]
          if active:
              raise SystemExit('FAIL: active social publisher/workflow still emits old website URLs: '+', '.join(active))
          print('PASS: zero legacy domain references in active social publishers and launch workflows.')
          PY
      - name: Report new approved social requests that still contain old site URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          roots = ('publications/requests/', 'publications/meta-requests/',
                   'publications/staged-meta-requests/', 'publications/auto-shorts-requests/')
          # Historical published request/receipt snapshots must never be rewritten.
          # Detect ALL legacy-bearing request JSONs, not only those in HEAD diff,
          # so older prepared-but-unpublished requests remain visible for review.
          # Only new/modified requests fail this gate; all old candidates are
          # reported and the upload-time validators remain mandatory.
          base = subprocess.run(['git','rev-parse','HEAD^'], capture_output=True, text=True)
          paths = []
          if base.returncode == 0:
              changed = subprocess.run(['git','diff','--name-only','HEAD^','HEAD'],
                                       capture_output=True,text=True,check=True)
              paths = [p for p in changed.stdout.splitlines()
                       if p.startswith(roots) and p.endswith('.json')]
          bad = []
          legacy_inventory = []
          for root in roots:
              directory = pathlib.Path(root)
              if not directory.exists():
                  continue
              for f in directory.rglob('*.json'):
                  if not f.is_file() or f.stat().st_size > 1_000_000:
                      continue
                  raw = f.read_text(encoding='utf-8', errors='replace')
                  if 'smartchoice365-web.pages.dev' not in raw:
                      continue
                  # Classification is advisory: a filename/status is NOT proof
                  # the item was published or safe to resend.
                  try:
                      obj = __import__('json').loads(raw)
                  except ValueError:
                      obj = {}
                  state = str(obj.get('status', obj.get('publishStatus', 'unknown'))) if isinstance(obj, dict) else 'unknown'
                  legacy_inventory.append((f.as_posix(), state))
                  if f.as_posix() in paths:
                      bad.append(f.as_posix())
          print('Legacy-bearing request snapshots (review before any future upload):')
          for filename,state in legacy_inventory:
              print('REVIEW', filename, 'stored-status='+state)
          print('Legacy request inventory:',len(legacy_inventory))
          if bad:
              sys.exit('BLOCKED: New or modified social request uses legacy Pages host: '
                       + ', '.join(bad))
          print('Verified new/modified social requests:',len(paths))
          print('Historical published requests and receipts were not rewritten.')
          print('WARNING: legacy requests must pass upload-time URL validation if reused; never auto-republish historic snapshots.')
          PY
