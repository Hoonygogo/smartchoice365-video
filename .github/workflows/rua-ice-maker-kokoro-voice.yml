name: "RUA Ice Maker — regenerate ALL 15 scenes with authentic Kokoro af_heart"
on:
  push:
    branches: [main]
    paths:
      - "ice-maker-english/kokoro_storyboard.json"
      - "ice-maker-english/render_kokoro_narration.py"
      - ".github/workflows/rua-ice-maker-kokoro-voice.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render_voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing approved free Kokoro CPU voice dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg libsndfile1
          python -m pip install -r english-guide/requirements.txt
      - name: Generate actual Kokoro af_heart 0.96 for ALL 15 scenes
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: python ice-maker-english/render_kokoro_narration.py
      - name: Retain new scene-synced narration for local final remix only
        uses: actions/upload-artifact@v4
        with:
          name: rua-ice-maker-kokoro-voice-${{ github.run_id }}
          path: ice-maker-english/output/
          retention-days: 3
      - name: Confirm actual engine and sample rate
        run: |
          python - <<'PY'
          import json, pathlib
          m=json.loads(pathlib.Path("ice-maker-english/output/kokoro_voice_manifest.json").read_text())
          assert m["engine"]=="Kokoro KPipeline (not eSpeak)"
          assert m["voice"]=="af_heart" and m["speed"]==0.96
          assert m["scene_count"]==15 and m["total_seconds"]>60
          print("VOICE_VALIDATED",m["total_seconds"])
          PY
