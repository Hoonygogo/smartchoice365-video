name: Recreate step three photo as natural food-only close-up
on:
  push:
    branches: [main]
    paths: ['.github/workflows/regen-three-bean-step03-v3.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smart-meals-step3-natural-food-20261118
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - run: python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Create recipe-exact no-human prep photo using confirmed free Workers AI
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED }}
        run: python3 scripts/regen_three_bean_step03.py
      - name: Retain unapproved image for visual QA
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/smart-meals-process-photos/three-bean-lemon-parsley-salad/step-03-natural-v3.* || true
          if ! git diff --cached --quiet; then
            git commit -m 'Candidate: food-only onion and parsley prep process image [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
