name: Cloudflare Temporary Image Handoff Roundtrip
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/image-handoff-roundtrip.yml'
permissions:
  contents: read
jobs:
  roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HANDOFF_TOKEN: ${{ secrets.IMAGE_HANDOFF_TOKEN }}
      HANDOFF_BASE_URL: https://sc365-video-handoff.hoon-sunghunjo.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare temporary binary upload download and deletion
        run: |
          python - <<'PY'
          import os,urllib.request,urllib.error,hashlib,uuid,json,struct,zlib,time
          base=os.environ['HANDOFF_BASE_URL'].rstrip('/')
          token=os.environ.get('HANDOFF_TOKEN','')
          assert len(token)>=16, 'IMAGE_HANDOFF_TOKEN secret is missing or too short'
          def chunk(t,b):
              return struct.pack('!I',len(b))+t+b+struct.pack('!I',zlib.crc32(t+b)&0xffffffff)
          # Valid standalone 1920x1080 photographic-size PNG with ~2 MB of data.
          # Random-like RGB bytes exercise a real binary payload, not a tiny compressed placeholder.
          w,h=1920,1080
          import random
          rng=random.Random(365)
          pixels=rng.randbytes(w*h*3)
          raw=b''.join(bytes([0])+pixels[y*w*3:(y+1)*w*3] for y in range(h))
          img=bytes([137,80,78,71,13,10,26,10])+chunk(b'IHDR',struct.pack('!2I5B',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw,1))+chunk(b'IEND',b'')
          digest=hashlib.sha256(img).hexdigest()
          assert len(img)>2_000_000, 'Test image payload is smaller than a real AI photo'
          key=uuid.uuid4().hex
          url=base+'/assets/'+key
          headers={'Authorization':'Bearer '+token,'Content-Type':'image/png','User-Agent':'SmartChoice365-Video-Handoff/1.0 (+GitHub-Actions)'}
          def request(method,data=None):
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as res:return res.status,res.read(),dict(res.headers)
              except urllib.error.HTTPError as e:
                  print('HTTP_DIAGNOSTIC',method,'status',e.code,'server',e.headers.get('server'),'content_type',e.headers.get('content-type'),'cf_ray_present',bool(e.headers.get('cf-ray')))
                  payload=e.read(600).decode('utf-8','replace')
                  # Response body may contain Cloudflare diagnostic text; never print auth headers/tokens.
                  import re
                  safe=re.sub(r'(?i)(token|secret|authorization)[^\\n]{0,120}', '[redacted]', payload)
                  print('HTTP_ERROR_BODY',repr(safe[:450]))
                  raise
          try:
              status,body,_=request('PUT',img)
              result=json.loads(body)
              assert status==201 and result['sha256']==digest and result['size']==len(img)
              # KV is eventually consistent: retries accommodate propagation.
              for attempt in range(12):
                  try:
                      status,download,metadata=request('GET')
                      if status==200:break
                  except urllib.error.HTTPError as e:
                      if e.code!=404:raise
                  time.sleep(2)
              else:raise RuntimeError('KV photo not readable after upload')
              assert download==img and hashlib.sha256(download).hexdigest()==digest
              assert metadata.get('X-Content-Sha256',metadata.get('x-content-sha256'))==digest
              status,body,_=request('DELETE')
              assert status==200 and json.loads(body)['deleted'] is True
              print(json.dumps({'status':'PASS','bytes':len(img),'sha256':digest,'temp_only':True,'deleted':True}))
          finally:
              try:request('DELETE')
              except Exception:pass
          PY
