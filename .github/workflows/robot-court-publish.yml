name: Publish approved English Robot Vacuum Buying Court
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/robot-court-publish.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: youtube-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve exact approved media without committing binary files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          root=Path('approved-artifact');root.mkdir()
          reqpath=Path('publications/requests/robot-buying-court-en-v1.json');req=json.loads(reqpath.read_text())
          assert req['approval']=='publish' and req['privacy']=='public'
          assert req['sha256']=='a21da373e62f8d17fc43cc96fe23189e03f77d68e306f59a460d8ccfcd91e459'
          media_sha=req['media_blob_sha']
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+media_sha
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=90) as response:data=json.load(response)
          media=base64.b64decode(data['content'])
          assert hashlib.sha256(media).hexdigest()==req['sha256']
          (root/'draft.mp4').write_bytes(media)
          sha=req['thumbnail_blob_sha']
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=45) as response:data=json.load(response)
          thumb=base64.b64decode(data['content'])
          assert hashlib.sha256(thumb).hexdigest()==req['thumbnail_sha256']
          (root/'thumbnail.jpg').write_bytes(thumb)
          evidence=Path('publications/evidence/robot-buying-court-en-v1.json').read_bytes()
          assert hashlib.sha256(evidence).hexdigest()==req['visual_evidence_sha256']
          audit=json.loads(evidence);assert audit['validation']['independent_photo_scenes']==8 and audit['validation']['source_scene_count']==12
          assert audit['validation']['source_photos_and_all_storyboards_reviewed'] is True
          run_id=int(os.environ['GITHUB_RUN_ID']);req['source_run_id']=run_id
          reqpath.write_text(json.dumps(req,ensure_ascii=False,indent=2))
          manifest={'id':req['id'],'sha256':req['sha256'],'quality_verified':True,'photo_led_scene_count':8,'source_run_id':run_id,'visual_evidence_sha256':req['visual_evidence_sha256']}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          (root/'publication_request.json').write_text(json.dumps(req,ensure_ascii=False,indent=2))
          (root/'visual_evidence.json').write_bytes(evidence)
          print('Exact approved MP4 hash and reviewed visual evidence verified.')
          PY
      - name: Verify MP4 structure and exact approved audio audit without reinstalling tools
        run: |
          python - <<'PY'
          import json,struct
          from pathlib import Path
          data=Path('approved-artifact/draft.mp4').read_bytes()
          def boxes(buf):
              pos=0
              while pos+8<=len(buf):
                  size,kind=struct.unpack_from('>I4s',buf,pos);header=8
                  if size==1:size=struct.unpack_from('>Q',buf,pos+8)[0];header=16
                  if size==0:size=len(buf)-pos
                  assert size>=header and pos+size<=len(buf)
                  yield kind,buf[pos+header:pos+size]
                  pos+=size
          def child(buf,name):return next(b for k,b in boxes(buf) if k==name)
          moov=child(data,b'moov');assert len(child(data,b'mdat'))>0
          tracks=[]
          for kind,tr in boxes(moov):
              if kind!=b'trak':continue
              mdia=child(tr,b'mdia');handler=child(mdia,b'hdlr')[8:12]
              stsd=child(child(child(mdia,b'minf'),b'stbl'),b'stsd');codec=stsd[12:16]
              if handler==b'vide':
                  tk=child(tr,b'tkhd');width,height=struct.unpack('>II',tk[-8:]);assert (width//65536,height//65536)==(1920,1080);assert codec==b'avc1'
              elif handler==b'soun':assert codec==b'mp4a'
              tracks.append(handler)
          assert b'vide' in tracks and b'soun' in tracks
          mv=child(moov,b'mvhd')
          if mv[0]==0:scale,duration=struct.unpack_from('>II',mv,12)
          else:scale=struct.unpack_from('>I',mv,20)[0];duration=struct.unpack_from('>Q',mv,24)[0]
          assert abs(duration/scale-225.91666666666666)<.2
          audit=json.loads(Path('approved-artifact/visual_evidence.json').read_text())
          req=json.loads(Path('approved-artifact/publication_request.json').read_text())
          assert audit['sha256']==req['sha256'] and audit['decoded_audio_rms']>.008
          assert audit['validation']['continuous_audio_timing'] is True
          print('PASS: exact-hash approved 1080p AVC/AAC file, duration, and previously decoded PCM audit verified. No repeat decoder installation.')
          
          PY
      - name: Retain exact approved artifact briefly
        uses: actions/upload-artifact@v4
        with:
          name: robot-court-approved-${{ github.run_id }}
          path: approved-artifact/
          retention-days: 3
      - name: Publish approved video and verify public processing
        env:
          PUBLICATION_REQUEST: publications/requests/robot-buying-court-en-v1.json
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python maintenance/publish_youtube_generic.py
      - name: Add website comment and thumbnail and verify saved text
        env:
          PUBLICATION_REQUEST: publications/requests/robot-buying-court-en-v1.json
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python maintenance/robot_after_publish.py
