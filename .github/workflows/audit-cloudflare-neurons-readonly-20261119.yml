name: Audit Cloudflare AI daily neurons read-only 2026-11-19
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-cloudflare-neurons-readonly-20261119.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query account AI inference usage (no inference requests)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,datetime,urllib.request,urllib.error
          aid=os.getenv('CF_ACCOUNT_ID','').strip()
          token=os.getenv('CF_ANALYTICS_TOKEN','').strip() or os.getenv('CF_AI_TOKEN','').strip()
          if not aid or not token:
              print('AUDIT_UNAVAILABLE missing account id or API token')
              raise SystemExit(0)
          now=datetime.datetime.now(datetime.timezone.utc)
          start=now.replace(hour=0,minute=0,second=0,microsecond=0)
          q='''query($tag:string!,$start:Time!,$end:Time!){
            viewer { accounts(filter:{accountTag:$tag}) {
              aiInferenceAdaptiveGroups(limit:1000,
                filter:{datetime_geq:$start,datetime_leq:$end},
                orderBy:[datetimeHour_ASC]) {
                count
                sum { totalNeurons totalProcessedPixels totalInputTokens totalOutputTokens }
                dimensions { datetimeHour modelId requestSource errorCode }
              }
            } }
          }'''
          payload=json.dumps({'query':q,'variables':{
            'tag':aid,'start':start.strftime('%Y-%m-%dT%H:%M:%SZ'),
            'end':now.strftime('%Y-%m-%dT%H:%M:%SZ')}}).encode()
          request=urllib.request.Request('https://api.cloudflare.com/client/v4/graphql',
            data=payload,headers={'Authorization':'Bearer '+token,
            'Content-Type':'application/json','User-Agent':'SmartMeals-Neurons-ReadOnly-Audit/1.0'})
          try:
              with urllib.request.urlopen(request,timeout=30) as resp:
                  result=json.load(resp)
          except urllib.error.HTTPError as e:
              print('AUDIT_HTTP_ERROR',e.code,
                e.read(700).decode('utf-8','replace').replace(token,'[redacted]')[:500])
              raise SystemExit(0)
          except Exception as e:
              print('AUDIT_FETCH_ERROR',type(e).__name__,str(e)[:180])
              raise SystemExit(0)
          if result.get('errors'):
              print('AUDIT_GRAPHQL_ERROR',json.dumps(result['errors'],ensure_ascii=False)[:1000])
              raise SystemExit(0)
          accts=(result.get('data') or {}).get('viewer',{}).get('accounts',[])
          if not accts:
              print('AUDIT_NO_ACCOUNT_DATA (token may lack Account Analytics Read)')
              raise SystemExit(0)
          rows=accts[0].get('aiInferenceAdaptiveGroups',[])
          print('AUDIT_INTERVAL_UTC',start.isoformat(),now.isoformat())
          print('AUDIT_ROWS',len(rows))
          from collections import defaultdict
          by_model=defaultdict(lambda:[0,0])
          by_hour=defaultdict(lambda:[0,0])
          by_source=defaultdict(lambda:[0,0])
          for r in rows:
              dim=r.get('dimensions') or {}
              total=float((r.get('sum') or {}).get('totalNeurons') or 0)
              count=int(r.get('count') or 0)
              for bucket,key in [(by_model,dim.get('modelId') or '(unrecorded)'),
                                 (by_hour,dim.get('datetimeHour') or '(unrecorded)'),
                                 (by_source,dim.get('requestSource') or '(unrecorded)')]:
                  bucket[key][0]+=count
                  bucket[key][1]+=total
          print('AUDIT_TOTAL',json.dumps({'requests':sum(r[0] for r in by_model.values()),
              'neurons':round(sum(r[1] for r in by_model.values()),3)}))
          for name,bucket in [('MODEL',by_model),('HOUR',by_hour),('SOURCE',by_source)]:
              for key,vals in sorted(bucket.items(),key=lambda x:-x[1][1])[:30]:
                  print('AUDIT_'+name,json.dumps({'key':key,'count':vals[0],
                    'neurons':round(vals[1],3)},ensure_ascii=False))
          PY
