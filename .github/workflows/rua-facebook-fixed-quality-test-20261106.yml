name: "RUA Heart Burst fixed - one-time Facebook quality test"
on:
  push:
    branches: [main]
    paths:
      - "publications/meta-requests/rua-heart-burst-fixed-fb-test-20261106.json"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: smartchoice365-meta-reels
  cancel-in-progress: false
jobs:
  publish-facebook-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact owner-uploaded corrected video and approval
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          f=Path("uploads/RUA_Facebook_Fixed.mp4")
          q=Path("publications/meta-requests/rua-heart-burst-fixed-fb-test-20261106.json")
          expected="4482cde10d668dd6e738ec9b498de2a616b9d98bce3bcabd37bfeab6d5fb95b6"
          if not f.is_file() or not q.is_file():
              raise SystemExit("Approved test media or request missing: do not publish.")
          if f.stat().st_size != 5986255 or hashlib.sha256(f.read_bytes()).hexdigest()!=expected:
              raise SystemExit("Test media differs from owner-uploaded file: do not publish.")
          req=json.loads(q.read_text(encoding="utf-8"))
          if req.get("sha256")!=expected or req.get("approval")!="publish" or req.get("platforms")!=["facebook"] or req.get("media_path")!=str(f):
              raise SystemExit("One-time Facebook-only test approval mismatch.")
          print("EXACT_CORRECTED_RUA_MP4_VERIFIED_FACEBOOK_ONLY")
          PY
      - name: Ensure media probe
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Publish owner-approved corrected Reel to Facebook only
        env:
          META_PUBLISH_ENABLED: "true"
          META_REQUEST_FILE: publications/meta-requests/rua-heart-burst-fixed-fb-test-20261106.json
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_SYSTEM_USER_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}
          META_FACEBOOK_PAGE_ID: ${{ vars.META_FACEBOOK_PAGE_ID || '1424295310764332' }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ vars.META_INSTAGRAM_ACCOUNT_ID || '17841475811391464' }}
          GH_TOKEN: ${{ github.token }}
        run: python maintenance/publish_meta_reels.py
      - name: Results location
        if: always()
        run: |
          echo "Check publications/meta-receipts/rua-heart-burst-fixed-fb-test-20261106-facebook.json" >> "$GITHUB_STEP_SUMMARY"
          echo "No YouTube, Instagram or Story upload is performed by this test workflow." >> "$GITHUB_STEP_SUMMARY"
