name: "RUA Qrevo review: Sarah/F1 Korean narration + accurate focus boxes"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rua-qrevo-sarah-focus-review-20261108.yml"
      - "maintenance/render_rua_qrevo_sarah_full_20261108.py"
permissions:
  contents: write
concurrency:
  group: rua-qrevo-sarah-focused-review-20261108
  cancel-in-progress: false
jobs:
  render-review-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free local Sarah voice and video render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Fetch pinned Supertonic 3 public model and approved F1 style
        run: python scripts/download_model.py
      - name: Render Sarah/F1 narrated review video and word-matched focus boxes
        run: python maintenance/render_rua_qrevo_sarah_full_20261108.py
      - name: Verify full MP4 and Korean narration cue timelines
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          folder=pathlib.Path("renders/rua-qrevo-sarah-20261108")
          vid=folder/"RUA_Qrevo_L_Pro_Full_Sarah_Focus_1080p.mp4"
          item=json.loads((folder/"Sarah_Focus_Timings.json").read_text())
          assert item["status"]=="review_only_unpublished"
          assert (item["voice"],item["language"],item["speed"],item["steps"])==("Sarah/F1","ko",1.1,8)
          assert len(item["timeline"])==27 and all(x["rms"]>=0.008 for x in item["timeline"])
          p=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration:stream=codec_type,codec_name,width,height","-of","json",str(vid)]))
          assert 130<float(p["format"]["duration"])<440, p["format"]["duration"]
          assert any(x.get("codec_type")=="audio" and x.get("codec_name")=="aac" for x in p["streams"])
          assert any(x.get("width")==1920 and x.get("height")==1080 for x in p["streams"])
          print("SARAH_REVIEW_PASS",vid.stat().st_size,vid)
          PY
          ffmpeg -hide_banner -v error -xerror -ss 40 -i renders/rua-qrevo-sarah-20261108/RUA_Qrevo_L_Pro_Full_Sarah_Focus_1080p.mp4 -t 8 -f null -
      - name: Save approved voice draft artifact for owner mobile review
        uses: actions/upload-artifact@v4
        with:
          name: RUA_Qrevo_Sarah_Focus_Review_Only
          path: renders/rua-qrevo-sarah-20261108/
          retention-days: 7
          if-no-files-found: error
      - name: Commit draft only to renders/ for direct video download
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renders/rua-qrevo-sarah-20261108/RUA_Qrevo_L_Pro_Full_Sarah_Focus_1080p.mp4
          git add renders/rua-qrevo-sarah-20261108/Sarah_Focus_Timings.json
          git add renders/rua-qrevo-sarah-20261108/Sarah_Focus_Captions.srt
          if ! git diff --cached --quiet; then
            git commit -m "Render Sarah/F1 Korean Qrevo 16:9 review draft (unpublished)"
            git push origin HEAD:main
          fi
      - name: Ensure the review is NOT published automatically
        run: |
          echo "This workflow is DRAFT ONLY. No publishing API was called." >> "$GITHUB_STEP_SUMMARY"
          echo "Approved voice: Supertonic 3 Sarah/F1, Korean ko, speed 1.1, 8 steps." >> "$GITHUB_STEP_SUMMARY"
          echo "Draft file: renders/rua-qrevo-sarah-20261108/RUA_Qrevo_L_Pro_Full_Sarah_Focus_1080p.mp4" >> "$GITHUB_STEP_SUMMARY"
          echo "The existing 16:9 upload gate is NOT triggered by renders/." >> "$GITHUB_STEP_SUMMARY"
