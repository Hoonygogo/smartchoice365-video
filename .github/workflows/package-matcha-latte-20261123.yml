name: Package QA-approved matcha latte hero and five process photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-matcha-latte-20261123.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Create original-resolution photo ZIP, contact sheet and manifest
        run: |
          python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
          python3 scripts/package_matcha_latte_photos_20261123.py
      - name: Commit verified user-downloadable bundle and contact preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/recipe-step-photo/iced-matcha-milk-latte/iced-matcha-milk-latte-hero-and-5-steps.zip
          git add artifacts/recipe-step-photo/iced-matcha-milk-latte/package-manifest.json
          git add artifacts/recipe-step-photo/iced-matcha-milk-latte/preview-contact-sheet.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Deliver verified six-photo matcha latte download bundle [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
