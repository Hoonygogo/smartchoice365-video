name: "RUA Heart Burst — one-time Meta Reels recovery (never upload YouTube)"
on:
  push:
    branches: [main]
    paths:
      - "publications/meta-requests/rua-heart-burst-20261105.json"
permissions:
  contents: write
  actions: read
concurrency:
  group: smartchoice365-meta-reels
  cancel-in-progress: false
jobs:
  publish-meta-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify approved uploaded original and publicly verified YouTube receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          p=Path("uploads/RUA_Heart_Burst_20261105.mp4")
          req=Path("publications/meta-requests/rua-heart-burst-20261105.json")
          receipt=Path("publications/receipts/rua-heart-burst-20261105-youtube.json")
          if not (p.is_file() and req.is_file() and receipt.is_file()):
              raise SystemExit("Missing exact approved media, request or YouTube receipt; do not publish.")
          expected="38625d685a36e1eb6d5c6421f10b02aba79ded7c5e99b6c6d5be6102326817b1"
          if p.stat().st_size != 3585977 or hashlib.sha256(p.read_bytes()).hexdigest()!=expected:
              raise SystemExit("Wrong approved video; no Meta publish.")
          r=json.loads(req.read_text(encoding="utf8"))
          y=json.loads(receipt.read_text(encoding="utf8"))
          if (r.get("id")!="rua-heart-burst-20261105" or r.get("sha256")!=expected
              or r.get("media_path")!=str(p) or r.get("approval")!="publish"
              or r.get("platforms")!=["instagram","facebook"]):
              raise SystemExit("Unapproved or mismatched Meta request.")
          if (y.get("status")!="published_verified" or y.get("video_id")!="7fxD3SRFqjo"
              or y.get("sha256")!=expected):
              raise SystemExit("YouTube receipt not verified. Never reupload YouTube from Meta recovery.")
          print("RUA exact MP4 + existing YouTube publication verified. Meta-only recovery authorized.")
          PY
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Publish to Instagram and Facebook Reels with existing duplicate receipts
        env:
          META_PUBLISH_ENABLED: "true"
          META_REQUEST_FILE: "publications/meta-requests/rua-heart-burst-20261105.json"
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_SYSTEM_USER_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}
          META_FACEBOOK_PAGE_ID: ${{ vars.META_FACEBOOK_PAGE_ID || '1424295310764332' }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ vars.META_INSTAGRAM_ACCOUNT_ID || '17841475811391464' }}
          GH_TOKEN: ${{ github.token }}
        run: python maintenance/publish_meta_reels.py
      - name: Attempt Story only if a separate visible CTA was pre-verified
        env:
          META_PUBLISH_ENABLED: "true"
          META_REQUEST_FILE: "publications/meta-requests/rua-heart-burst-20261105.json"
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_SYSTEM_USER_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}
          META_FACEBOOK_PAGE_ID: ${{ vars.META_FACEBOOK_PAGE_ID || '1424295310764332' }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ vars.META_INSTAGRAM_ACCOUNT_ID || '17841475811391464' }}
          GH_TOKEN: ${{ github.token }}
        run: python maintenance/publish_meta_story_from_reel.py
      - name: Record status
        if: always()
        run: |
          echo "Verify platform receipts under publications/meta-receipts/ before reporting success." >> "$GITHUB_STEP_SUMMARY"
          echo "No YouTube upload is present in this workflow. Instagram Story requires separately verified visible CTA." >> "$GITHUB_STEP_SUMMARY"
