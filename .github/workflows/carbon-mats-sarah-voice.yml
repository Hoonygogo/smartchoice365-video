name: Carbon mats Korean Sarah voice (review only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mats/request.json'
      - 'mats/render_voice.py'
      - '.github/workflows/carbon-mats-sarah-voice.yml'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free Korean voice dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Download pinned Supertonic 3 model
        run: python scripts/download_model.py
      - name: Generate Korean Sarah narration and timestamps
        run: python mats/render_voice.py
      - name: Archive review-only audio and timing files
        uses: actions/upload-artifact@v4
        with:
          name: sc365-carbon-mats-sarah-ko
          path: mats/output/
          retention-days: 3
          if-no-files-found: error
