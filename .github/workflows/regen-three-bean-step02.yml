name: Fix Smart Meals step 2 physically grounded bean rinsing photo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/regen-three-bean-step02.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: step-two-beans-natural-image
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: One free physically grounded source-matched step-two image
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED }}
        run: python3 scripts/regen_three_bean_step02.py
      - name: Commit image candidate for visual quality inspection
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/smart-meals-process-photos/three-bean-lemon-parsley-salad/step-02-natural-v2.* || true
          if ! git diff --cached --quiet; then
            git commit -m "Candidate: physically grounded bean rinse photo for review [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
