name: Package reviewed lemon herb chickpea couscous photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-couscous-photos-20261124.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: couscous-seven-photo-final-package-20261124
  cancel-in-progress: false
jobs:
  package-seven-photos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Validate seven separate original JPEG photos and create ZIP with contact sheet
        run: |
          python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
          python3 -m py_compile scripts/package_couscous_process_photos_20261124.py
          python3 scripts/package_couscous_process_photos_20261124.py
      - name: Commit verified photo ZIP, preview and hash manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/recipe-step-photo/lemon-herb-chickpea-couscous/couscous-hero-and-6-process-photos.zip
          git add artifacts/recipe-step-photo/lemon-herb-chickpea-couscous/preview-contact-sheet.jpg
          git add artifacts/recipe-step-photo/lemon-herb-chickpea-couscous/package-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Package reviewed lemon herb chickpea couscous seven images and contact sheet [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
# Refresh after corrected moist couscous stage 3 revision 7
