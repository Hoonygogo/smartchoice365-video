name: "RUA Ice Maker Four-Part — approved YouTube and Meta release"
on:
  push:
    branches: [main]
    paths:
      - "uploads/RUA_IceMaker_4Part_20261106.mp4"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: "rua-ice-maker-4part-20261106-one-time-publish"
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify user-approved video, original audio and exact SHA before publishing
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          p=pathlib.Path("uploads/RUA_IceMaker_4Part_20261106.mp4")
          if not p.is_file(): raise SystemExit("Approved MP4 not yet uploaded")
          raw=p.read_bytes()
          if len(raw)!=23793681 or hashlib.sha256(raw).hexdigest()!="9161982fc310abd5a515a6a1b645304b7165c789c061dafc2a0d27292cb024f2":
              raise SystemExit("Wrong video bytes, do not publish")
          d=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(p)]))
          v=[x for x in d["streams"] if x["codec_type"]=="video"]
          a=[x for x in d["streams"] if x["codec_type"]=="audio"]
          if (len(v),len(a))!=(1,1) or v[0]["codec_name"]!="h264" or a[0]["codec_name"]!="aac":
              raise SystemExit("Required H264/AAC streams missing")
          if (v[0]["width"],v[0]["height"])!=(1080,1920) or abs(float(d["format"]["duration"])-39.875)>0.08:
              raise SystemExit("Wrong format or duration")
          print("Exact RUA ice maker 4-episode owner-approved master VERIFIED")
          PY
          ffmpeg -hide_banner -v error -xerror -i uploads/RUA_IceMaker_4Part_20261106.mp4 -f null -
      - name: Upload YouTube Short and verify public processing and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python maintenance/publish_rua_ice_maker_20261106.py
      - name: Construct exact hash-bound Meta requests
        run: |
          mkdir -p publications/meta-requests
          python - <<'PY'
          import json
          from pathlib import Path
          home="https://smartchoice365-web.pages.dev/"
          channel="https://www.youtube.com/channel/UC4DzAW-Hbd45bIECwGV7-uA"
          request={
            "id":"rua-ice-maker-4part-20261106",
            "approval":"publish",
            "channel_intro":True,
            "channel_id":"UC4DzAW-Hbd45bIECwGV7-uA",
            "platforms":["instagram","facebook"],
            "media_path":"uploads/RUA_IceMaker_4Part_20261106.mp4",
            "sha256":"9161982fc310abd5a515a6a1b645304b7165c789c061dafc2a0d27292cb024f2",
            "facebook_title":"RUA vs The Ice Maker! The Last Cube | Smart Choice 365",
            "share_to_instagram_story":True,
            "captions":{
              "instagram":"RUA vs the ice maker! 🧊😂 Four hilarious cartoon moments in one Short.\nCompare smarter: "+home+"\nWatch more RUA: "+channel+"\nFull ice maker buying guide video coming soon. Find us via the link in bio.\nThis is fictional 3D animation, not a real product test.\n#RUA #IceMaker #SmartChoice365 #Reels #BuyingGuide",
              "facebook":"RUA vs the ice maker! 🧊😂 See how one tiny ice cube caused big trouble.\nBuying guides: "+home+"\nWatch more RUA: "+channel+"\nFull ice maker comparison video in production.\nFictional cartoon animation, not a hands-on product test.\n#RUA #IceMaker #SmartChoice365 #Reels"
            },
            "approval_note":"Owner explicitly approved 39.875s four-episode RUA ice maker MP4 including official ending for YouTube Shorts, Instagram/Facebook Reels and Instagram Story. Full guide not publicly released yet: refer to official channel/homepage, never fabricate full-video ID."
          }
          Path("publications/meta-requests/rua-ice-maker-4part-20261106.json").write_text(json.dumps(request,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Publish Instagram Reel, Facebook Reel and Instagram Story
        env:
          META_PUBLISH_ENABLED: "true"
          META_REQUEST_FILE: "publications/meta-requests/rua-ice-maker-4part-20261106.json"
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_SYSTEM_USER_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}
          META_FACEBOOK_PAGE_ID: ${{ vars.META_FACEBOOK_PAGE_ID || '1424295310764332' }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ vars.META_INSTAGRAM_ACCOUNT_ID || '17841475811391464' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python maintenance/publish_meta_reels.py
          python maintenance/publish_meta_story_from_reel.py
      - name: Publication verification reminders
        if: always()
        run: |
          echo "Check publications/receipts/rua-ice-maker-4part-20261106-youtube.json and publications/meta-receipts for IG/FB/Story." >> "$GITHUB_STEP_SUMMARY"
          echo "Partial failures must be investigated using existing receipts: never blindly repost." >> "$GITHUB_STEP_SUMMARY"
          echo "Once full buying guide is published, add its real ID as YouTube Short's related video." >> "$GITHUB_STEP_SUMMARY"
